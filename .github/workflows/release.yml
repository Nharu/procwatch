name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: macos-15
    permissions:
      contents: write
    concurrency: release
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha256: ${{ steps.package.outputs.sha256 }}
    steps:
      - name: Fetch release preflight script
        uses: actions/checkout@v4
        with:
          path: preflight
          sparse-checkout: app/scripts/check-release-env.sh
          sparse-checkout-cone-mode: false

      - name: Check release secrets
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_APP_PASSWORD: ${{ secrets.NOTARY_APP_PASSWORD }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: bash preflight/app/scripts/check-release-env.sh

      - name: Read version from tag
        id: version
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag must be v<major>.<minor>.<patch>: $GITHUB_REF_NAME"
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import Developer ID certificate
        id: signing
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/release.keychain-db"
          p12="$RUNNER_TEMP/developer-id.p12"
          keychain_password="$(openssl rand -hex 24)"
          printf '%s' "$DEVELOPER_ID_P12_BASE64" | base64 --decode > "$p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$p12" -k "$keychain" -P "$DEVELOPER_ID_P12_PASSWORD" -f pkcs12 -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$keychain" | awk '/"Developer ID Application/ { print $2; exit }')"
          if [[ -z "$identity" ]]; then
            echo "::error::no Developer ID Application identity in the imported certificate"
            exit 1
          fi
          echo "identity=$identity" >> "$GITHUB_OUTPUT"

      - name: Build and sign app bundle
        env:
          PROCWATCH_SIGN_IDENTITY: ${{ steps.signing.outputs.identity }}
        run: PROCWATCH_VERSION="$VERSION" bash app/scripts/build-app.sh

      - name: Notarize
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_APP_PASSWORD: ${{ secrets.NOTARY_APP_PASSWORD }}
        run: |
          submission="$RUNNER_TEMP/procwatch-notarize.zip"
          ditto -c -k --keepParent app/.build/bundle/procwatch.app "$submission"
          result="$(xcrun notarytool submit "$submission" \
            --apple-id "$NOTARY_APPLE_ID" --team-id "$NOTARY_TEAM_ID" --password "$NOTARY_APP_PASSWORD" \
            --wait --output-format json)"
          echo "$result"
          status="$(printf '%s' "$result" | plutil -extract status raw -o - -)"
          if [[ "$status" != "Accepted" ]]; then
            id="$(printf '%s' "$result" | plutil -extract id raw -o - -)"
            xcrun notarytool log "$id" \
              --apple-id "$NOTARY_APPLE_ID" --team-id "$NOTARY_TEAM_ID" --password "$NOTARY_APP_PASSWORD"
            echo "::error::notarization status: $status"
            exit 1
          fi

      - name: Staple and package
        id: package
        run: |
          app=app/.build/bundle/procwatch.app
          xcrun stapler staple "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose "$app"
          zip="procwatch-$VERSION.zip"
          ditto -c -k --keepParent "$app" "$zip"
          sha256="$(shasum -a 256 "$zip" | awk '{ print $1 }')"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "procwatch-$VERSION.zip" --title "procwatch $VERSION" --generate-notes --verify-tag

      - name: Remove signing keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/release.keychain-db" || true
          rm -f "$RUNNER_TEMP/developer-id.p12"

  tap:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Update Homebrew tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.release.outputs.version }}
          SHA256: ${{ needs.release.outputs.sha256 }}
        run: |
          tap="$RUNNER_TEMP/homebrew-tap"
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/Nharu/homebrew-tap.git" "$tap"
          mkdir -p "$tap/Casks"
          bash app/scripts/render-cask.sh "$VERSION" "$SHA256" "$tap/Casks/procwatch.rb"
          cd "$tap"
          git add Casks/procwatch.rb
          if git diff --cached --quiet; then
            echo "tap already has procwatch $VERSION"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "procwatch $VERSION"
          git push origin HEAD
